<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLP — Machine Learning samengevat</title>
  <meta name="description" content="Machine Learning stof helder samengevat: van de basis tot scikit-learn, loss functions, logistic regression en SVM's — met formules, voorbeelden en uitvoerbare code.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#161616">

  <!-- Thema vóór het eerste paint zetten (voorkomt kleurflits) -->
  <script>
    (function () {
      var theme = "dark"; /* zoals het origineel: donker + pastel */
      try {
        var stored = localStorage.getItem("mlp-theme");
        if (stored === "light" || stored === "dark") theme = stored;
      } catch (e) { /* localStorage geblokkeerd → donker */ }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23161616' stroke='%23303030'/%3E%3Ctext x='32' y='42' font-family='Lexend, Arial, sans-serif' font-size='23' font-weight='700' fill='%237FDBDA' text-anchor='middle'%3EML%3C/text%3E%3C/svg%3E">

  <!-- Lexend: rustig, oogvriendelijk font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&display=swap">

  <!-- KaTeX voor formules -->

</head>
<body>

        <span class="visually-hidden">Menu</span>
      </button>
      <a class="brand" href="#/" aria-label="MLP — naar startpagina">
        <span class="brand-name">MLP</span>
        <span class="brand-sub">machine&nbsp;learning&nbsp;practice</span>
      </a>
      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="themeToggle" aria-label="Schakel naar licht thema" title="Schakel naar licht thema">
          <svg class="icon-moon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13.8 10A6.1 6.1 0 0 1 6 2.2 6.1 6.1 0 1 0 13.8 10z"/></svg>

        </button>
        <button type="button" class="lang-toggle" id="langToggle" aria-label="Switch to English" title="Switch to English">EN</button>
      </div>
    </div>
  </header>

  <div class="layout" id="layout">
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-scroll">

        <div class="search-status" id="searchStatus" hidden></div>
        <div class="search-results" id="searchResults" aria-live="polite"></div>
        <nav class="sidebar-nav" id="sidebarNav" aria-label="Onderwerpen">
          <!--wordt gevuld door js/app.js-->
        </nav>
      </div>
    </aside>

    <main class="content" id="app" tabindex="-1">
      <noscript>
        <section class="noscript-card">
          <h2>JavaScript staat uit</h2>
          <p>Deze site rendert haar inhoud met JavaScript. Zet JavaScript aan om de samenvattingen te lezen.</p>
        </section>
      </noscript>
      <div id="view" class="view"></div>

  </div>

  <footer class="site-footer">
    <span class="footer-text">MLP · Machine Learning samenvattingen · formules &amp; uitvoerbare code</span>

  <script defer src="js/content.js"></script>

  <script defer src="js/app.js"></script>
